<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Medito</title>
    <script>
      // GitHub Pages não tem roteamento no servidor. Este truque redireciona
      // qualquer rota desconhecida (ex: /meditto/history) de volta para o
      // index.html, codificada na query string, para o React Router assumir.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // /meditto
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
